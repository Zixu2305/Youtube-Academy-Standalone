services:
  mysql:
    image: mysql:${MYSQL_VERSION}
    container_name: yta-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Any .sql here runs ON FIRST INIT only (when the volume is empty)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command: >
      --mysql-native-password=ON
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
  seed_skillsfuture:
    build:
      context: .
      dockerfile: etl/skillsfuture/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SEED_OUT_DIR: /app/out
    volumes:
      - ./data:/app/data:ro
      - ./out:/app/out

  adminer:
    image: adminer:4
    container_name: yta-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      mysql:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: yta-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  mongodb:
    image: mongo:latest
    container_name: yta-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodb_data:/data/db
      
  seed_youtube:
    build:
      context: .
      dockerfile: etl/youtube/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_DATABASE: ${MONGO_DATABASE}
      OLLAMA_HOST: http://ollama:11434
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    ports:
      - "5001:5000"
    volumes:
      - ./.env:/app/.env:ro
      - ./pipelines/__init__.py:/app/pipelines/__init__.py:ro
      - ./pipelines/youtube:/app/pipelines/youtube:ro
      - ./pipelines/quiz_gen:/app/pipelines/quiz_gen

  ollama:
    image: ollama/ollama
    container_name: yta-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-init:
    image: ollama/ollama
    container_name: yta-ollama-init
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c", "sleep 8 && ollama pull llama3.2:3b"]
    restart: "no"


volumes:
  mysql_data:
  mongodb_data:
  qdrant_data:
  ollama_data:

